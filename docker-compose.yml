services:
  mysql:
    image: mysql:8.4
    container_name: logsentinel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logsentinel}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - /opt/logsentinel/data/mysql:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - logsentinel

  redis:
    image: redis:7.4-alpine
    container_name: logsentinel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - /opt/logsentinel/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - logsentinel

  backend:
    image: logsentinel-backend:latest
    container_name: logsentinel-backend
    restart: unless-stopped
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logsentinel}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin@123}
    volumes:
      - /opt/logsentinel/logs:/app/logs
      # 本机日志采集：宿主机日志目录只读挂载到容器 /logs，日志源路径配置为 /logs/...
      - ${LOG_ROOT:-/var/log}:/logs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - logsentinel

  web:
    image: logsentinel-web:latest
    container_name: logsentinel-web
    restart: unless-stopped
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "0.0.0.0:${WEB_PORT:-6064}:80"
    networks:
      - logsentinel

networks:
  logsentinel:
    driver: bridge
